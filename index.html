<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles/style.css" />
    <title>Jurassic Stack</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="An island to survive on: gather, build, tame, and light the beacon. Built in three.js." />
    <meta name="theme-color" content="#101a12" />
  </head>
  <body>
    <div id="app"></div>

    <!-- The boot card. The page used to sit black for ten seconds and then
         drop you into the world mid-warm-up; now the island loads behind
         this, and the first frame you see is a warm one. -->
    <div id="boot">
      <h1>JURASSIC STACK</h1>
      <p id="boot-line">reading the island…</p>
      <div id="boot-bar"><i></i></div>
      <p id="boot-hint">WASD to move · SHIFT to sprint · E to interact · TAB for the pack</p>
    </div>

    <!-- DOM HUD layers (same pattern as minecraft-JS: game canvas in #app,
         UI as plain DOM on top, built/managed from src/scripts). -->
    <div id="hud"></div>
    <div id="status"></div>

    <script type="module" src="/src/scripts/main.ts"></script>
  </body>
</html>
